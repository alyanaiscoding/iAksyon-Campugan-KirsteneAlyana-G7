<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iAksyon | Resident Dashboard</title>
</head>
<body>
    {% if messages %}
    {% for message in messages %}
        <p role="status" style="color: green;">
            {{ message }}
        </p>
    {% endfor %}
    {% endif %}

    <h1>iAksyon</h1>
    <h2>Resident Dashboard</h2>

    <h3>Welcome, {{ user.first_name }}!</h3>

    <p>Username: {{ user.username }}</p>
    <p>Role: {{ user.get_role_display }}</p>

    <hr>

    <h3>Resident Services</h3>

    <a href="{% url 'report_create' %}">Create Report</a>
    <a href="{% url 'report_list' %}">View My Reports</a>
    <button disabled>Check Report Status</button>
    <a href="{% url 'profile' %}">My Profile</a>

    <hr>

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
    </form>

</body>
</html>
