<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iAksyon | Admin Dashboard</title>
</head>
<body>

    <h1>iAksyon</h1>
    <h2>Admin Dashboard</h2>

    <h3>Welcome, {{ user.first_name }}!</h3>

    <p>Username: {{ user.username }}</p>
    <p>Role: {{ user.get_role_display }}</p>

    <hr>

    <h3>Report Management</h3>

    <button disabled>View All Reports</button>
    <a href="{% url 'admin_report_list' %}">
        Update Status
    </a>
    <a href="{% url 'admin_report_list' %}">
        View Reports
    </a>
    <a href="{% url 'analytics_dashboard' %}">
        Analytics Dashboard
    </a>

    <hr>

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
    </form>

</body>
</html>
