<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile | iAksyon</title>
</head>
<body>

    <h1>iAksyon</h1>
    <h2>My Profile</h2>

    <p>Username: {{ user.username }}</p>
    <p>Role: {{ user.get_role_display }}</p>

    <hr>

    <h3>Edit Personal Information</h3>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Changes</button>
    </form>

    <br>

    <a href="{% url 'resident_dashboard' %}">
        Back to Dashboard
    </a>

</body>
</html>
