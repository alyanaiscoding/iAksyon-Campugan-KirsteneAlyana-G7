<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Report | iAksyon</title>
</head>
<body>

    <h1>Delete Report</h1>

    <p>Are you sure you want to delete this report?</p>

    <p><strong>Title:</strong> {{ object.title }}</p>
    <p><strong>Category:</strong> {{ object.get_category_display }}</p>
    <p><strong>Location:</strong> {{ object.location }}</p>
    <p><strong>Status:</strong> {{ object.get_status_display }}</p>

    <p>This action cannot be undone.</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>

    <br>

    <a href="{% url 'report_list' %}">Cancel</a>

</body>
</html>
